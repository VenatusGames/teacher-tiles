<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Solid timer with a tile background and partially filled shape">
  <defs><radialGradient id="solidFill" cx="139" cy="100" r="290" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a9d4ff"/><stop offset=".42" stop-color="#63adf6"/><stop offset="1" stop-color="#3b88db"/></radialGradient>
    <radialGradient id="timerFace" cx="30%" cy="19%" r="82%">
      <stop offset="0" stop-color="#edf3fa"/>
      <stop offset="0.42" stop-color="#dce7f4"/>
      <stop offset="1" stop-color="#d2dfed"/>
    </radialGradient>
    <linearGradient id="timerSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".05"/>
    </linearGradient>
    <filter id="timerShadow" x="-24%" y="-20%" width="148%" height="158%">
