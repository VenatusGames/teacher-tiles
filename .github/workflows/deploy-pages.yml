name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/

      - name: Cache-bust local assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          version = os.environ['ASSET_VERSION']

          html = re.sub(
              r'(?P<prefix>(?:href|src)=["\'])(?P<asset>(?:styles\.css|app\.js|changelog/data\.js))(?P<suffix>["\'])',
              lambda match: f"{match.group('prefix')}{match.group('asset')}?v={version}{match.group('suffix')}",
              html,
          )
          index.write_text(html, encoding='utf-8')
          PY

          grep -q "styles.css?v=${ASSET_VERSION}" _site/index.html
          grep -q "app.js?v=${ASSET_VERSION}" _site/index.html
          grep -q "changelog/data.js?v=${ASSET_VERSION}" _site/index.html

          echo "Cache-busting completed successfully."
          echo "Asset version: ${ASSET_VERSION}"
          grep -oE '(styles\.css|app\.js|changelog/data\.js)\?v=[^" ]+' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
