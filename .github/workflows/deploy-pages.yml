name: Deploy teacher-tiles via GitHub Pages

run-name: '${{ github.ref_name }}: ${{ github.event.head_commit.message }}'

# Each branch publishes only its own slice of teachertiles.com:
#   main    -> /          (teachertiles-6739b)
#   sandbox -> /sandbox/  (teachertiles-6739b)
#   wigs    -> /wigs/
#   dev     -> /dev/      (teachertiles-dev)
#
# The combined site is stored on the `gh-pages` branch. A push rebuilds only the
# pushed branch, replaces its folder on `gh-pages`, then deploys `gh-pages` as-is.
# If `gh-pages` does not exist yet, the first run seeds it with main, sandbox and wigs.
#
# Firebase web config comes from repository variables (Settings > Secrets and
# variables > Actions > Variables), each holding the firebaseConfig object as JSON:
#   FIREBASE_CONFIG_LIVE  teachertiles-6739b; optional, falls back to the committed firebase-config.js
#   FIREBASE_CONFIG_DEV   teachertiles-dev; required for dev, the build fails without it

on:
  push:
    branches:
      - main
      - sandbox
      - wigs
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PAGES_BRANCH: gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site
        env:
          FIREBASE_CONFIG_LIVE: ${{ vars.FIREBASE_CONFIG_LIVE }}
          FIREBASE_CONFIG_DEV: ${{ vars.FIREBASE_CONFIG_DEV }}
        run: |
          set -euo pipefail

          # Folder on the site for each branch ("" = site root).
          site_dir() {
            case "$1" in
              main) echo "" ;;
              sandbox) echo "sandbox" ;;
              wigs) echo "wigs" ;;
              dev) echo "dev" ;;
              *) echo "No site folder configured for branch '$1'" >&2; return 1 ;;
            esac
          }

          # Which Firebase backend each branch talks to.
          firebase_config() {
            case "$1" in
              dev)
                if test -z "${FIREBASE_CONFIG_DEV}"; then
                  echo "::error::Set the FIREBASE_CONFIG_DEV repository variable before deploying dev." >&2
                  return 1
                fi
                echo "${FIREBASE_CONFIG_DEV}" ;;
              *) echo "${FIREBASE_CONFIG_LIVE}" ;;
            esac
          }

          write_firebase_config() {
            local branch="$1" out="$2" config
            test -f "${out}/firebase-config.js" || return 0
            config="$(firebase_config "${branch}")"
            if test -z "${config}"; then
              echo "Using committed firebase-config.js for ${branch}"
              return 0
            fi
            echo "${config}" | node -e '
              const config = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (!config.apiKey || !config.projectId) throw Error("Firebase config needs apiKey and projectId");
              process.stdout.write(`export const firebaseConfig = ${JSON.stringify(config, null, 2)};\n`);
            ' > "${out}/firebase-config.js"
            echo "Wrote firebase-config.js for ${branch} (project $(node -p 'JSON.parse(process.argv[1]).projectId' "${config}"))"
          }

          build_branch() {
            local branch="$1" out="$2" ref
            if test "${branch}" = "${GITHUB_REF_NAME}"; then ref="${GITHUB_SHA}"; else ref="origin/${branch}"; fi
            echo "Building ${branch} at $(git rev-parse --short "${ref}")"
            rm -rf "${out}"
            mkdir -p "${out}"
            if test "${branch}" = wigs; then
              # A real checkout, not an archive: the wigs tests audit `git ls-files`.
              local src="${RUNNER_TEMP}/wigs-source"
              git worktree add --force --detach "${src}" "${ref}"
              npm install --global pnpm@11.19.0
              (cd "${src}" && pnpm install --frozen-lockfile && pnpm test && pnpm build)
              cp -R "${src}/dist/." "${out}/"
            else
              git archive "${ref}" | tar -x -C "${out}"
              write_firebase_config "${branch}" "${out}"
              if test -f "${out}/sandbox/build.cjs"; then
                node "${out}/sandbox/build.cjs" "${out}"
              fi
            fi
            # Keep development checks in Git, but leave them out of the published site.
            find "${out}" -type f -name '*.test.cjs' -delete
            # GITHUB_TOKEN may not push workflow files, and Pages never served them anyway.
            rm -rf "${out}/.github"
            test -f "${out}/index.html" || { echo "::error::${branch} build produced no index.html" >&2; return 1; }
            printf '%s\t%s\n' "${branch}" "$(git rev-parse --short "${ref}") $(git log -1 --pretty=%s "${ref}")" >> "${RUNNER_TEMP}/built.tsv"
          }

          : > "${RUNNER_TEMP}/built.tsv"
          if git ls-remote --exit-code --heads origin "${PAGES_BRANCH}" >/dev/null; then
            branches=("${GITHUB_REF_NAME}")
          else
            echo "No ${PAGES_BRANCH} branch yet; seeding it with main, sandbox and wigs."
            branches=(main sandbox wigs)
            if ! printf '%s\n' "${branches[@]}" | grep -qx "${GITHUB_REF_NAME}"; then branches+=("${GITHUB_REF_NAME}"); fi
          fi

          for branch in "${branches[@]}"; do
            dir="$(site_dir "${branch}")"
            build_branch "${branch}" "${RUNNER_TEMP}/build/${branch}"
            printf '%s\t%s\n' "${branch}" "${dir}" >> "${RUNNER_TEMP}/targets.tsv"
          done

      - name: Cache-bust local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import time

          version = str(int(time.time() * 1000))
          asset_pattern = r'(?P<prefix>(?:href|src)=["\'])(?P<asset>(?![a-zA-Z][a-zA-Z0-9+.-]*:)(?!//)[^"\'?]+\.(?:js|css))(?:\?[^"\']*)?(?P<suffix>["\'])'
          temp = Path(os.environ['RUNNER_TEMP'])

          for line in (temp / 'targets.tsv').read_text().splitlines():
              branch, _, site_dir = line.partition('\t')
              root = (temp / 'build' / branch).resolve()
              # Root-absolute URLs include the branch's site folder, e.g. /wigs/assets/app.js.
              url_prefix = f'/{site_dir}/' if site_dir else '/'
              for index in [root / 'index.html', root / 'board.html']:
                  if not index.is_file():
                      continue
                  html = index.read_text(encoding='utf-8')
                  local_assets = list(re.finditer(asset_pattern, html))
                  for match in local_assets:
                      asset_path = match.group('asset')
                      if asset_path.startswith('/'):
                          if not asset_path.startswith(url_prefix):
                              raise SystemExit(f'{index} references {asset_path}, outside {url_prefix}')
                          asset = (root / asset_path[len(url_prefix):]).resolve()
                      else:
                          asset = (index.parent / asset_path).resolve()
                      if not asset.is_relative_to(root):
                          raise SystemExit(f'Asset path escapes the {branch} site directory: {asset_path}')
                      if not asset.is_file():
                          raise SystemExit(f'Missing local asset referenced by {index}: {asset_path}')
                  html, replacements = re.subn(
                      asset_pattern,
                      lambda match: f"{match.group('prefix')}{match.group('asset')}?v={version}{match.group('suffix')}",
                      html,
                  )
                  index.write_text(html, encoding='utf-8')
                  print(f'{branch}: cache-busted {replacements} local assets in {index.name} with v={version}')
          PY

      - name: Publish to ${{ env.PAGES_BRANCH }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pages="${RUNNER_TEMP}/pages"
          # Folders owned by other branches; a root (main) publish must leave them alone.
          reserved='^(\.git|\.nojekyll|sandbox|wigs|dev)$'

          for attempt in 1 2 3 4 5; do
            rm -rf "${pages}"
            if git ls-remote --exit-code --heads origin "${PAGES_BRANCH}" >/dev/null; then
              git fetch --depth 1 origin "${PAGES_BRANCH}"
              git worktree prune
              git worktree add --force --detach "${pages}" FETCH_HEAD
            else
              git worktree add --force --orphan -b "publish-${GITHUB_RUN_ID:-local}-${attempt}" "${pages}"
            fi

            while IFS=$'\t' read -r branch dir; do
              src="${RUNNER_TEMP}/build/${branch}"
              if test -z "${dir}"; then
                find "${pages}" -mindepth 1 -maxdepth 1 -printf '%f\n' | { grep -Ev "${reserved}" || true; } | while read -r name; do rm -rf "${pages:?}/${name}"; done
                cp -R "${src}/." "${pages}/"
              else
                rm -rf "${pages:?}/${dir}"
                mkdir -p "${pages}/${dir}"
                cp -R "${src}/." "${pages}/${dir}/"
              fi
            done < "${RUNNER_TEMP}/targets.tsv"
            touch "${pages}/.nojekyll"

            git -C "${pages}" add -A
            if git -C "${pages}" diff --cached --quiet; then
              echo "Nothing changed on ${PAGES_BRANCH}."
              exit 0
            fi
            git -C "${pages}" commit -q -m "Deploy ${GITHUB_REF_NAME} @ ${GITHUB_SHA::12}"
            if git -C "${pages}" push origin "HEAD:refs/heads/${PAGES_BRANCH}"; then
              {
                echo '### Published'
                while IFS=$'\t' read -r branch info; do echo "- \`${branch}\`: ${info}"; done < "${RUNNER_TEMP}/built.tsv"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (another branch published first); retrying (${attempt}/5)."
            git worktree remove --force "${pages}"
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish to ${PAGES_BRANCH} after 5 attempts." >&2
          exit 1

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Every deploy ships the latest gh-pages, so a newer queued deploy covers any
    # older one GitHub drops from the queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ${{ env.PAGES_BRANCH }}
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PAGES_BRANCH }}

      - name: Check site entry points
        run: |
          for index in index.html sandbox/index.html wigs/index.html dev/index.html; do
            test -f "${index}" || { echo "::error::Missing ${index} on ${PAGES_BRANCH}" >&2; exit 1; }
          done
          echo "Deploying ${PAGES_BRANCH} @ $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report deployment result
        run: |
          {
            echo '### Deployment result'
            echo "- Deployed \`${PAGES_BRANCH}\` @ \`$(git rev-parse --short HEAD)\` — $(git log -1 --pretty=%s)"
            echo '- Main: https://teachertiles.com/'
            echo '- Sandbox: https://teachertiles.com/sandbox/'
            echo '- Wigs: https://teachertiles.com/wigs/'
            if test -f dev/index.html; then echo '- Dev: https://teachertiles.com/dev/'; fi
          } >> "$GITHUB_STEP_SUMMARY"
