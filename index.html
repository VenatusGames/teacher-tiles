<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeacherTiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="teachertiles-intro" class="teachertiles-intro" aria-hidden="true">
    <div class="teachertiles-intro__content">
      <div class="teachertiles-intro__tiles" aria-hidden="true">
        <img class="teachertiles-intro__tile teachertiles-intro__tile--left" src="assets/title-tile-light.png" alt="">
        <img class="teachertiles-intro__tile teachertiles-intro__tile--right" src="assets/title-tile-dark.png" alt="">
      </div>
      <div class="teachertiles-intro__title"><span class="teachertiles-intro__teacher">Teacher</span><span class="teachertiles-intro__tiles-word">Tiles</span></div>
      <div class="teachertiles-intro__subtitle">an app by Mr. Weikert</div>
    </div>
  </div>

  <main id="workspace" class="workspace" aria-label="Module workspace"><div class="snap-guide snap-guide-x" aria-hidden="true"></div><div class="snap-guide snap-guide-y" aria-hidden="true"></div></main>

  <div id="trash-zone" class="trash-zone" aria-hidden="true">
    <div class="trash-can" aria-hidden="true">
      <span class="trash-lid"></span><span class="trash-body"><i></i><i></i><i></i></span>
    </div>
    <span class="trash-label">DELETE</span>
  </div>

  <div class="workspace-controls" aria-label="Workspace controls">
    <button id="changelog-toggle" class="workspace-control" type="button" title="What’s new" aria-label="Open changelog">
      <svg class="news-megaphone-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 13.5h3l8 4V6.5l-8 4h-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M7.5 13.5l1.4 5h2.7l-1.3-4.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.7 9.1c.8.8 1.3 1.8 1.3 2.9s-.5 2.1-1.3 2.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="ui-sfx-toggle" class="workspace-control" type="button" title="Mute UI sounds" aria-label="Mute UI sounds">♪</button>
    <button id="theme-toggle" class="workspace-control" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
    <button id="fullscreen-toggle" class="workspace-control" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
  </div>

  <div class="workspace-credit" aria-hidden="true">TeacherTiles - an app by Mr. Weikert</div>

  <div id="context-menu" class="context-menu" role="menu" aria-hidden="true">
    <div class="context-menu__header">
      <div class="context-menu__title">Add module</div>
      <div class="context-menu__filters" role="tablist" aria-label="Module categories">
        <button type="button" class="context-menu__filter is-active" data-category-filter="all">ALL</button>
        <button type="button" class="context-menu__filter" data-category-filter="text">TEXT</button>
        <button type="button" class="context-menu__filter" data-category-filter="media">MEDIA</button>
        <button type="button" class="context-menu__filter" data-category-filter="tools">TOOLS</button>
        <button type="button" class="context-menu__filter" data-category-filter="audio">AUDIO</button>
        <button type="button" class="context-menu__filter" data-category-filter="games">GAMES</button>
      </div>
    </div>
    <div class="context-menu__list">
      <button class="context-menu__item" data-module="sticky" data-category="text"><span class="context-menu__icon">▤</span><span><strong>Sticky note</strong><small>Write and format notes</small></span></button>
      <button class="context-menu__item" data-module="textbubble" data-category="text"><span class="context-menu__icon" aria-hidden="true">Aa</span><span><strong>Text bubble</strong><small>Simple scalable text display</small></span></button>
      <button class="context-menu__item" data-module="todo" data-category="text"><span class="context-menu__icon" aria-hidden="true">☑</span><span><strong>To-Do</strong><small>Build a customizable checklist</small></span></button>
      <button class="context-menu__item" data-module="image" data-category="media"><span class="context-menu__icon" aria-hidden="true">▧</span><span><strong>Image</strong><small>Display an image on the board</small></span></button>
      <button class="context-menu__item" data-module="youtube" data-category="media"><span class="context-menu__icon" aria-hidden="true">▶</span><span><strong>YouTube</strong><small>Play a YouTube video</small></span></button>
      <button class="context-menu__item" data-module="windowshare" data-category="media">
        <span class="context-menu__icon context-menu__icon--windowshare" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="5" width="17" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8 20h8M12 17.5V20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M9 11.2l2 2 4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span><strong>Window Share</strong><small>Share a tab, window, or screen</small></span>
      </button>
      <button class="context-menu__item" data-module="timer" data-category="tools"><span class="context-menu__icon">◷</span><span><strong>Visual timer</strong><small>Shape-based progress timer</small></span></button>
      <button class="context-menu__item" data-module="interactive" data-category="tools"><span class="context-menu__icon">⌛</span><span><strong>Interactive timers</strong><small>Hourglass and melting candle</small></span></button>
      <button class="context-menu__item" data-module="clock" data-category="tools"><span class="context-menu__icon">◴</span><span><strong>Clock</strong><small>Current time display</small></span></button>
      <button class="context-menu__item" data-module="noise" data-category="audio"><span class="context-menu__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.8 11.5a5.2 5.2 0 0 0 10.4 0M12 16.7V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span><strong>Noise detector</strong><small>Live microphone sound level</small></span></button>
      <button class="context-menu__item" data-module="collections" data-category="tools"><span class="context-menu__icon context-menu__icon--jar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3h8v2H8zM7 5h10l1 3v10.5A2.5 2.5 0 0 1 15.5 21h-7A2.5 2.5 0 0 1 6 18.5V8l1-3Zm1.2 3-.2.7v9.8c0 .3.2.5.5.5h7c.3 0 .5-.2.5-.5V8.7l-.2-.7H8.2Z"/></svg></span><span><strong>Collections</strong><small>Fill a jar with rewards</small></span></button>
      <button class="context-menu__item" data-module="stoplight" data-category="tools"><span class="context-menu__icon context-menu__icon--stoplight" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm3 3a2.2 2.2 0 1 0 0 4.4A2.2 2.2 0 0 0 12 5Zm0 4.8a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4Zm0 4.8a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4Z"/></svg></span><span><strong>Stoplight</strong><small>GO, LISTEN, and STOP visual cue</small></span></button>
      <button class="context-menu__item" data-module="spinner" data-category="tools">
        <span class="context-menu__icon context-menu__icon--spinner" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 3.5v8.5l6.3 3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 1.6l-1.6 2.5h3.2z" fill="currentColor"/>
          </svg>
        </span>
        <span><strong>Spinner</strong><small>Spin a wheel to pick a name</small></span>
      </button>
      
      <button class="context-menu__item" data-module="hangman" data-category="games">
        <span class="context-menu__icon context-menu__icon--hangman" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 21h12M8 21V3h8v3M16 6v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="10.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M16 13v4M12.8 15l3.2-2 3.2 2M13.5 20l2.5-3 2.5 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span><strong>Hangman</strong><small>Guess the hidden word</small></span>
      </button>
      <button class="context-menu__item" data-module="boombox" data-category="audio"><span class="context-menu__icon" aria-hidden="true">♫</span><span><strong>Boom Box</strong><small>Loop classroom soundscapes</small></span></button>
    </div>
  </div>

  <template id="sticky-template">
    <section class="module sticky-module" data-type="sticky" data-color="yellow" data-font="inter">
      <button class="module-delete" aria-label="Delete sticky note">×</button>
      <div class="module-drag-handle"></div>
      <div class="sticky-toolbar">
        <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
        <button type="button" data-command="italic" title="Italic"><em>I</em></button>
        <button type="button" data-command="underline" title="Underline"><u>U</u></button>
        <select class="sticky-font-size" aria-label="Font size"><option>14</option><option selected>16</option><option>18</option><option>22</option><option>28</option><option>36</option></select>
        <button type="button" class="sticky-font-cycle" title="Change note font" aria-label="Change note font"><span class="icon-font" aria-hidden="true">Aa</span></button>
        <button type="button" class="sticky-color-cycle" title="Cycle note color" aria-label="Cycle note color"><span></span></button>
      </div>
      <div class="sticky-editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing..."></div>
      <div class="resize-handle resize-handle--tl" data-resize="tl"></div><div class="resize-handle resize-handle--tr" data-resize="tr"></div><div class="resize-handle resize-handle--bl" data-resize="bl"></div><div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <template id="timer-template">
    <section class="module timer-module" data-type="timer" data-bg="white" data-shape-color="blue">
      <button class="module-delete" aria-label="Delete timer">×</button><div class="module-drag-handle"></div><div class="confetti-layer" aria-hidden="true"></div>
      <div class="timer-stage">
        <div class="timer-visual">
          <svg class="timer-shape-svg" viewBox="0 0 100 100" aria-hidden="true">
            <defs><clipPath class="shape-clip"><path></path></clipPath></defs>
            <foreignObject x="0" y="0" width="100" height="100" class="shape-foreign"><div xmlns="http://www.w3.org/1999/xhtml" class="shape-fill"></div></foreignObject>
            <path class="shape-outline" vector-effect="non-scaling-stroke"></path>
          </svg>
          <div class="timer-remaining">05:00</div>
        </div>
      </div>
      <div class="timer-controls">
        <div class="timer-shapes"><button data-shape="circle" class="is-active">●</button><button data-shape="triangle">▲</button><button data-shape="square">■</button><button data-shape="star">★</button><button data-shape="heart">♥</button></div>
        <div class="timer-customization" aria-label="Visual timer customization">
          <button class="custom-icon timer-bg" type="button" title="Change module background" aria-label="Change module background"><span class="icon-palette" aria-hidden="true"></span></button>
          <button class="custom-icon timer-shape-color" type="button" title="Change shape color" aria-label="Change shape color"><span class="timer-color-swatch" aria-hidden="true"></span></button>
        </div>
        <div class="timer-presets"><button data-minutes="1">1m</button><button data-minutes="5" class="is-active">5m</button><button data-minutes="10">10m</button><button data-minutes="15">15m</button><button data-minutes="25">25m</button><button data-minutes="30">30m</button></div>
        <div class="timer-custom-row"><input class="timer-custom" type="number" min="1" max="999" placeholder="Minutes"><button class="timer-set">Set</button></div>
        <div class="timer-actions"><button class="timer-start primary">Start</button><button class="timer-reset">Reset</button></div>
      </div>
      <div class="resize-handle resize-handle--tl" data-resize="tl"></div><div class="resize-handle resize-handle--tr" data-resize="tr"></div><div class="resize-handle resize-handle--bl" data-resize="bl"></div><div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <template id="interactive-template">
    <section class="module interactive-module" data-type="interactive" data-bg="white" data-interactive-mode="hourglass" data-candle-color="cream">
      <button class="module-delete" aria-label="Delete interactive timer">×</button><div class="module-drag-handle"></div>
      <div class="hourglass-stage">
        <div class="hourglass-countdown">05:00</div>
        <svg class="hourglass-svg" viewBox="0 0 260 340" aria-label="Animated hourglass">
          <defs>
            <linearGradient id="woodTop" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#aa7847"/><stop offset="0.45" stop-color="#7b4f2c"/><stop offset="1" stop-color="#50301c"/></linearGradient>
            <linearGradient id="woodPost" x1="0" x2="1"><stop offset="0" stop-color="#55311c"/><stop offset="0.45" stop-color="#98653a"/><stop offset="1" stop-color="#4c2a18"/></linearGradient>
            <linearGradient id="glassGlow" x1="0" x2="1"><stop offset="0" stop-color="rgba(255,255,255,.10)"/><stop offset=".35" stop-color="rgba(255,255,255,.72)"/><stop offset=".58" stop-color="rgba(218,239,255,.16)"/><stop offset="1" stop-color="rgba(255,255,255,.08)"/></linearGradient>
            <linearGradient id="sandGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8a6"/><stop offset=".48" stop-color="#edbd58"/><stop offset="1" stop-color="#c98328"/></linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-opacity=".2"/></filter>
            <clipPath class="hg-top-clip"><path d="M58 62 H202 C193 104 170 132 140 158 H120 C90 132 67 104 58 62Z"/></clipPath>
            <clipPath class="hg-bottom-clip"><path d="M120 182 H140 C170 208 193 236 202 278 H58 C67 236 90 208 120 182Z"/></clipPath>
          </defs>
          <g filter="url(#softShadow)">
            <rect x="30" y="28" width="200" height="28" rx="14" fill="url(#woodTop)"/>
            <rect x="30" y="284" width="200" height="28" rx="14" fill="url(#woodTop)"/>
            <rect x="38" y="50" width="17" height="240" rx="8.5" fill="url(#woodPost)"/>
            <rect x="205" y="50" width="17" height="240" rx="8.5" fill="url(#woodPost)"/>
            <path d="M58 62 H202 C193 104 170 132 140 158 H120 C90 132 67 104 58 62Z" fill="rgba(232,246,255,.20)" stroke="rgba(143,174,196,.72)" stroke-width="4"/>
            <path d="M120 182 H140 C170 208 193 236 202 278 H58 C67 236 90 208 120 182Z" fill="rgba(232,246,255,.20)" stroke="rgba(143,174,196,.72)" stroke-width="4"/>
            <path d="M120 158 C124 166 124 176 120 182 H140 C136 176 136 166 140 158Z" fill="rgba(232,246,255,.20)" stroke="rgba(143,174,196,.72)" stroke-width="3"/>
            <rect x="58" y="62" width="144" height="96" class="hg-sand-top" clip-path="url(#hg-top-placeholder)" fill="url(#sandGold)"/>
            <rect x="58" y="278" width="144" height="0" class="hg-sand-bottom" fill="url(#sandGold)"/>
            <path class="hg-bottom-pile" d="M75 278 Q130 244 185 278 Z" fill="url(#sandGold)" opacity="0"/>
            <rect x="127" y="158" width="6" height="26" rx="3" class="hg-stream" fill="url(#sandGold)" opacity="0"/>
            <path d="M72 70 C78 96 96 121 121 147" fill="none" stroke="url(#glassGlow)" stroke-width="7" stroke-linecap="round" opacity=".7"/>
            <path d="M72 270 C78 244 96 219 121 193" fill="none" stroke="url(#glassGlow)" stroke-width="7" stroke-linecap="round" opacity=".56"/>
          </g>
        </svg>
      </div>
      <div class="candle-stage" hidden>
        <div class="candle-countdown">05:00</div>
        <div class="candle-scene" aria-label="Melting candle timer">
          <div class="candle-body">
            <div class="candle-glow"></div>
            <div class="candle-flame"><span></span></div>
            <div class="candle-wick"></div>
            <div class="candle-wax-top"></div>
            <div class="candle-drip candle-drip-a"></div>
            <div class="candle-drip candle-drip-b"></div>
            <div class="candle-highlight"></div>
          </div>
          <div class="candle-base-shadow"></div>
        </div>
      </div>
      <div class="timer-controls">
        <div class="interactive-picker"><button type="button" data-interactive="hourglass" class="is-active" title="Hourglass">⌛</button><button type="button" data-interactive="candle" title="Candle">🕯</button></div>
        <div class="timer-customization interactive-customization" aria-label="Interactive timer customization">
          <button class="custom-icon interactive-bg" type="button" title="Change module background" aria-label="Change module background"><span class="icon-palette" aria-hidden="true"></span></button>
          <button class="custom-icon candle-color-control" type="button" title="Change candle color" aria-label="Change candle color"><span class="candle-color-swatch" aria-hidden="true"></span></button>
        </div>
        <div class="timer-presets"><button data-minutes="1">1m</button><button data-minutes="5" class="is-active">5m</button><button data-minutes="10">10m</button><button data-minutes="15">15m</button><button data-minutes="25">25m</button><button data-minutes="30">30m</button></div>
        <div class="timer-custom-row"><input class="timer-custom" type="number" min="1" max="999" placeholder="Minutes"><button class="timer-set">Set</button></div>
        <div class="timer-actions"><button class="timer-start primary">Start</button><button class="timer-reset">Reset</button></div>
      </div>
      <div class="resize-handle resize-handle--tl" data-resize="tl"></div><div class="resize-handle resize-handle--tr" data-resize="tr"></div><div class="resize-handle resize-handle--bl" data-resize="bl"></div><div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <template id="clock-template">
    <section class="module clock-module" data-type="clock" data-bg="white" data-font="inter" data-text="dark">
      <button class="module-delete" aria-label="Delete clock">×</button><div class="module-drag-handle"></div>
      <div class="clock-display"><div class="clock-content"><span class="clock-main">12:00</span><span class="clock-seconds">:00</span><span class="clock-period">PM</span></div></div>
      <div class="customization-bar clock-customization" aria-label="Clock customization">
        <button class="custom-icon clock-bg" title="Change background color" aria-label="Change background color"><span class="icon-palette" aria-hidden="true"></span></button>
        <button class="custom-icon clock-font" title="Change clock font" aria-label="Change clock font"><span class="icon-font" aria-hidden="true">Aa</span></button>
        <button class="custom-icon clock-text" title="Change text color" aria-label="Change text color"><span class="icon-text-color" aria-hidden="true">A</span></button>
        <button class="custom-icon clock-toggle-seconds" title="Show or hide seconds" aria-label="Show or hide seconds"><span aria-hidden="true">:SS</span></button>
        <button class="custom-icon clock-toggle-period is-active" title="Show or hide AM/PM" aria-label="Show or hide AM/PM"><span aria-hidden="true">AM</span></button>
      </div>
      <div class="resize-handle resize-handle--tl" data-resize="tl"></div><div class="resize-handle resize-handle--tr" data-resize="tr"></div><div class="resize-handle resize-handle--bl" data-resize="bl"></div><div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <template id="noise-template">
    <section class="module noise-module" data-type="noise" data-bg="white" data-font="inter" data-text="dark" data-meter="blue">
      <button class="module-delete" aria-label="Delete noise detector">×</button><div class="module-drag-handle"></div>
      <div class="noise-content">
        <div class="noise-title-row"><strong>Noise Level</strong><span class="noise-db">—</span></div>
        <div class="noise-meter"><div class="noise-fill"></div><div class="noise-threshold"></div></div>
        <div class="noise-status">Microphone is off</div>
        <div class="noise-main-controls"><button class="noise-start primary">Enable microphone</button><label>Alert <input class="noise-range" type="range" min="10" max="100" value="70"></label></div>
      </div>
      <div class="customization-bar noise-customization" aria-label="Noise meter customization">
        <button class="custom-icon noise-bg" title="Change background color" aria-label="Change background color"><span class="icon-palette" aria-hidden="true"></span></button>
        <button class="custom-icon noise-font" title="Change font" aria-label="Change font"><span class="icon-font" aria-hidden="true">Aa</span></button>
        <button class="custom-icon noise-text" title="Change text color" aria-label="Change text color"><span class="icon-text-color" aria-hidden="true">A</span></button>
        <button class="custom-icon noise-meter-color" title="Change meter color" aria-label="Change meter color"><span class="icon-meter" aria-hidden="true"><i></i><i></i><i></i></span></button>
      </div>
      <div class="resize-handle resize-handle--tl" data-resize="tl"></div><div class="resize-handle resize-handle--tr" data-resize="tr"></div><div class="resize-handle resize-handle--bl" data-resize="bl"></div><div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>


  <template id="collections-template">
    <section class="module collections-module" data-type="collections" data-item="pompom" data-bg="white">
      <button class="module-delete" aria-label="Delete collection jar">×</button><div class="module-drag-handle"></div>
      <div class="collection-stage">
        <div class="collection-title">Collection Jar</div>
        <canvas class="collection-canvas" aria-label="Interactive collection jar. Click the jar to add an item."></canvas>
        <div class="collection-count">0 items</div>
      </div>
      <div class="collection-controls">
        <button class="collection-add primary" type="button">+ Add</button>
        <div class="collection-picker-wrap">
          <button class="collection-type" type="button" title="Choose collectible" aria-expanded="false">
            <span class="collectible-preview collection-current-preview preview-pompom" aria-hidden="true"></span><span class="collection-type-label">Pom poms</span><span class="collection-chevron">⌃</span>
          </button>
          <div class="collection-picker" hidden>

  <template id="windowshare-template">

            </svg>
          </span>

        <div class="windowshare-controls">

  <template id="boombox-template">
    <section class="module boombox-module" data-type="boombox" data-player-style="compact">

      <button class="boombox-style-button" type="button" aria-label="Change player appearance" title="Change player appearance">◫</button>

        <div class="boombox-progress"><span></span></div>
        <div class="boombox-time"><span class="boombox-current">0:00</span><span class="boombox-duration">0:00</span></div>

  <template id="hangman-template">
    <section class="module hangman-module" data-type="hangman" data-bg="white" data-font="inter">
      <button class="module-delete" aria-label="Delete Hangman">×</button>
      <div class="module-drag-handle"></div>
      <div class="confetti-layer" aria-hidden="true"></div>

      <div class="hangman-header">
        <div>
          <span class="hangman-kicker">HANGMAN</span>
          <strong class="hangman-status">READY</strong>
        </div>
      </div>

      <div class="hangman-game">
        <div class="hangman-figure" aria-hidden="true">
          <svg viewBox="0 0 180 190">
            <path class="hangman-gallows" d="M24 174h128M48 174V22h83M131 22v27" />
            <circle class="hangman-part hangman-part-1" cx="131" cy="64" r="15"/>
            <path class="hangman-part hangman-part-2" d="M131 79v48"/>
            <path class="hangman-part hangman-part-3" d="M131 91l-25 20"/>
            <path class="hangman-part hangman-part-4" d="M131 91l25 20"/>
            <path class="hangman-part hangman-part-5" d="M131 127l-22 31"/>
            <path class="hangman-part hangman-part-6" d="M131 127l22 31"/>
          </svg>
        </div>

        <div class="hangman-play-area">
          <div class="hangman-word" aria-label="Hidden word"></div>
          <div class="hangman-wrong-row">
            <span>INCORRECT</span>
            <strong class="hangman-wrong-letters">—</strong>
          </div>
          <div class="hangman-keyboard" aria-label="Letter choices"></div>
        </div>
      </div>

      <div class="hangman-setup">
        <div class="hangman-setup-card">
          <span class="hangman-setup-label">TEACHER SETUP</span>
          <strong>Set the secret word</strong>
          <p>Letters and spaces are supported. Spaces will be shown automatically.</p>
          <input class="hangman-word-input" type="password" maxlength="40" autocomplete="off" placeholder="Enter a word or phrase">
          <div class="hangman-setup-actions">
            <button class="hangman-save-word" type="button">Start game</button>
          </div>
        </div>
      </div>

      <div class="hangman-result" hidden>
        <div class="hangman-result-card">
          <span class="hangman-result-label"></span>
          <strong class="hangman-result-message"></strong>
          <span class="hangman-result-hint">Click anywhere to play again</span>
        </div>
      </div>

      <div class="customization-bar hangman-customization" aria-label="Hangman customization">
        <button class="custom-icon hangman-bg" title="Change background color" aria-label="Change background color"><span class="icon-palette" aria-hidden="true"></span></button>
        <button class="custom-icon hangman-font" title="Change font" aria-label="Change font"><span class="icon-font" aria-hidden="true">Aa</span></button>
      </div>

      <div class="resize-handle resize-handle--tl" data-resize="tl"></div>
      <div class="resize-handle resize-handle--tr" data-resize="tr"></div>
      <div class="resize-handle resize-handle--bl" data-resize="bl"></div>
      <div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <template id="spinner-template">
    <section class="module spinner-module" data-type="spinner" data-bg="white" data-font="inter">
      <button class="module-delete" aria-label="Delete Spinner">×</button>
      <div class="module-drag-handle"></div>

      <div class="spinner-shell">
        <div class="spinner-winner" aria-live="polite">CLICK TO SPIN</div>

        <div class="spinner-wheel-wrap">
          <div class="spinner-pointer" aria-hidden="true"></div>
          <canvas class="spinner-canvas" width="560" height="560" aria-label="Spinner wheel"></canvas>
          <button class="spinner-spin-button" type="button" aria-label="Spin the wheel">SPIN</button>

          <div class="spinner-result-overlay" hidden aria-live="assertive">
            <span class="spinner-result-label">WINNER</span>
            <strong class="spinner-result-name"></strong>
          </div>
        </div>

        <div class="spinner-settings">
          <div class="spinner-name-entry">
            <input class="spinner-name-input" type="text" maxlength="40" placeholder="Add a name">
            <button class="spinner-add-name" type="button">Add</button>
          </div>
          <div class="spinner-name-list" aria-label="Spinner names"></div>
        </div>
      </div>

      <div class="customization-bar spinner-customization" aria-label="Spinner customization">
        <button class="custom-icon spinner-bg" title="Change background color" aria-label="Change background color"><span class="icon-palette" aria-hidden="true"></span></button>
        <button class="custom-icon spinner-font" title="Change font" aria-label="Change font"><span class="icon-font" aria-hidden="true">Aa</span></button>
      </div>

      <div class="spinner-confetti-layer" aria-hidden="true"></div>
      <audio class="spinner-spin-audio" src="assets/ui/spin.mp3" preload="metadata"></audio>

      <div class="resize-handle resize-handle--tl" data-resize="tl"></div>
      <div class="resize-handle resize-handle--tr" data-resize="tr"></div>
      <div class="resize-handle resize-handle--bl" data-resize="bl"></div>
      <div class="resize-handle resize-handle--br" data-resize="br"></div>
    </section>
  </template>

  <div id="changelog-backdrop" class="changelog-backdrop" hidden>
    <section id="changelog-panel" class="changelog-panel" role="dialog" aria-modal="true" aria-labelledby="changelog-title">
      <header class="changelog-header">
        <div>
          <span class="changelog-eyebrow">TEACHERTILES</span>
          <h2 id="changelog-title">What’s new</h2>
        </div>
        <button id="changelog-close" class="changelog-close" type="button" aria-label="Close changelog">×</button>
      </header>
      <div id="changelog-content" class="changelog-content">
        <div class="changelog-loading">Loading changelog…</div>
      </div>
    </section>
  </div>

</body>
